# Lance la base SQL Server (bases AdventureWorks restaurées) et le tableau de bord
#   1. copier .env.example en .env et choisir un mot de passe
#   2. docker compose up --build
#   3. ouvrir http://localhost:8501
services:
  db:
    build:
      context: .
      args:
        MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD manquant, voir .env.example}
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d AdventureWorks2019 -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
