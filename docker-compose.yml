# Lance la base SQL Server (bases AdventureWorks) et le tableau de bord
#   1. copier .env.example en .env et choisir un mot de passe
#   2. docker compose up -d          (télécharge les images publiées sur Docker Hub)
#      ou docker compose up -d --build   (construit les images à partir du code)
#   3. ouvrir http://localhost:8501
services:
  db:
    image: olaffsen/adventureworks-db:latest
    build: .
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD manquant, voir .env.example}
    volumes:
      # Conserve les bases et le mot de passe SA entre deux lancements
      - mssql-data:/var/opt/mssql

  dashboard:
    image: olaffsen/adventureworks-dashboard:latest
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
