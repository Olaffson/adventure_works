# Publie les images de la base et du tableau de bord sur Docker Hub à chaque modification sur main.
# Configuration (GitHub > Settings > Secrets and variables > Actions) :
#   - variable DOCKERHUB_USERNAME : nom du compte Docker Hub
#   - secret   DOCKERHUB_TOKEN    : jeton d'accès Docker Hub (Read & Write)
# Tant que la variable n'est pas définie, le workflow est ignoré.
name: Publication Docker Hub

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - dashboard/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

jobs:
  publier:
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: adventureworks-db
            context: .
          - image: adventureworks-dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
